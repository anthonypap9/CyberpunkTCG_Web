<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>Night City TCG Trainer (unofficial fan tool)</title>
<link rel="icon" href="icon.svg">

<style>:root {
  --bg: #0d0f13; --surface: #151922; --surface2: #1c222e; --line: #2a3140; --text: #e9ecf2; --muted: #8e97a8;
  --red: #ef5b5f; --green: #3ad08a; --blue: #4f9dff; --yellow: #f4c542; --accent: #f4c542; --ok: #3ad08a; --bad: #ef5b5f;
  --cw: clamp(58px, calc((100vh - 480px) / 4.7), 150px);
  --hw: calc(var(--cw) * 1.38);
  --fw: calc(var(--cw) * 1.45);
  --r: 8px;
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (max-width: 899px), (max-height: 700px) { :root { --cw: 56px; --hw: 76px; --fw: 70px; } }
@media (max-width: 520px) { :root { --cw: 54px; --hw: 70px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
button { font: inherit; color: inherit; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
h1, h2, h3 { margin: 0; font-weight: 600; }
small, .muted { color: var(--muted); }

#app { height: 100%; }

/* ------------------------------------------------------------------ menu / screens */
.screen { height: 100%; overflow: auto; padding: max(16px, env(safe-area-inset-top)) 16px 24px; }
.wrap { max-width: 920px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 4px; }
.brand h1 { font-size: 26px; letter-spacing: .02em; }
.brand .tag { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
.fine { font-size: 12px; color: var(--muted); margin: 4px 0 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.deckpick { text-align: left; width: 100%; display: block; padding: 12px; border-radius: 10px; }
.deckpick.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.deckpick b { display: block; font-size: 16px; }
.deckpick span { font-size: 12px; color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button.on { background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ------------------------------------------------------------------ game shell */
.game { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; position: relative; }
.top { display: flex; align-items: center; gap: 8px; padding: max(6px, env(safe-area-inset-top)) 10px 6px; border-bottom: 1px solid var(--line); background: var(--surface); min-height: 44px; }
.top .title { font-weight: 600; font-size: 14px; }
.top .status { font-size: 13px; color: var(--muted); }
.top button { padding: 5px 9px; font-size: 13px; }
.cols { display: grid; grid-template-columns: 1fr; min-height: 0; }
@media (min-width: 1100px) and (orientation: landscape) { .cols.logopen { grid-template-columns: 1fr 270px; } .cols.logopen .logpanel.open { position: static; width: auto; box-shadow: none; top: auto; } }
.board { display: flex; flex-direction: column; min-height: 0; padding: 6px 8px 0; gap: 4px; overflow-x: hidden; overflow-y: auto; }

.half { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; align-items: start; }
.half.rival { grid-template-areas: "rail field gigs"; grid-template-columns: auto 1fr auto; }
.half.me { grid-template-areas: "rail field gigs"; grid-template-columns: auto 1fr auto; }
@media (max-width: 899px) and (orientation: portrait) {
  .half { grid-template-areas: "rail rail" "field gigs" !important; grid-template-columns: 1fr auto !important; }
}
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
.zone-field { grid-area: field; min-height: calc(var(--cw) * 1.4 + 18px); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; border: 1px dashed var(--line); border-radius: 8px; padding: 6px; }
.zone-gigs { grid-area: gigs; display: flex; flex-direction: column; gap: 6px; min-width: 112px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px; }
.zlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); width: 100%; }
.zlabel b { color: var(--text); font-weight: 600; }
.legends { display: flex; gap: 4px; }
.eddies { display: flex; flex-wrap: wrap; gap: 3px; border: 1px dashed var(--line); border-radius: 6px; padding: 4px; min-height: 26px; align-items: center; }
.eddy { width: 16px; height: 16px; border-radius: 4px; background: var(--accent); }
.eddy.spent { background: #4a4330; transform: rotate(90deg); }
.counts { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
.fixer { display: flex; gap: 3px; flex-wrap: wrap; }
.dicerow { display: flex; gap: 4px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ dice */
.die { --s: 34px; width: var(--s); height: var(--s); display: grid; place-items: center; background: var(--surface2); color: var(--text); font-weight: 700; font-size: 14px; position: relative; border: none; padding: 0; }
.die::before { content: ''; position: absolute; inset: 0; background: var(--dc, #3a4358); clip-path: var(--shape); z-index: 0; }
.die::after { content: ''; position: absolute; inset: 2px; background: #10141b; clip-path: var(--shape); z-index: 1; }
.die span { position: relative; z-index: 2; }
.die small { position: absolute; z-index: 2; bottom: -1px; right: 1px; font-size: 8px; color: var(--muted); font-weight: 500; }
.die.d4 { --shape: polygon(50% 4%, 98% 96%, 2% 96%); } .die.d6 { --shape: polygon(8% 8%, 92% 8%, 92% 92%, 8% 92%); }
.die.d8 { --shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); } .die.d10 { --shape: polygon(50% 0, 100% 40%, 80% 100%, 20% 100%, 0 40%); }
.die.d12 { --shape: polygon(50% 0, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%); } .die.d20 { --shape: polygon(30% 4%, 70% 4%, 100% 50%, 70% 96%, 30% 96%, 0 50%); }
.die.mine { --dc: var(--accent); } .die.theirs { --dc: #7d8798; }
.die.fix { opacity: .55; --s: 28px; font-size: 11px; }
.die.pick { opacity: 1; --dc: var(--ok); cursor: pointer; }
.die.rolling span { animation: flicker .09s steps(2) infinite; }
.die.rolling { animation: spin .7s ease-out; }
.die.flash { animation: flash 1s ease-out; }
@keyframes spin { from { transform: rotate(0) scale(1.5); } to { transform: rotate(540deg) scale(1); } }
@keyframes flicker { 50% { opacity: .35; } }
@keyframes flash { 0% { filter: drop-shadow(0 0 8px var(--ok)); transform: scale(1.35); } 100% { filter: none; transform: none; } }

/* ------------------------------------------------------------------ cards */
.card { --cc: #777; width: var(--cw); aspect-ratio: 5 / 7; background: linear-gradient(180deg, #1d2430, #171c26); border: 2px solid var(--cc); border-radius: var(--r); position: relative; user-select: none; touch-action: none; cursor: pointer; flex: none; font-size: calc(var(--cw) * .115); line-height: 1.15; transition: transform .15s, box-shadow .15s; overflow: hidden; }
.card.red { --cc: var(--red); } .card.green { --cc: var(--green); } .card.blue { --cc: var(--blue); } .card.yellow { --cc: var(--yellow); }
.card .cost { position: absolute; top: 3px; left: 3px; min-width: 1.7em; height: 1.7em; padding: 0 .25em; border-radius: 4px; background: var(--cc); color: #101319; font-weight: 700; display: grid; place-items: center; font-size: 1.15em; }
.card .cost.sell::after { content: '€$'; position: absolute; top: 50%; left: calc(100% + 3px); transform: translateY(-50%); font-size: .6em; color: var(--accent); line-height: 1; white-space: nowrap; }
.card .type { position: absolute; top: 4px; right: 4px; font-size: .62em; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; max-width: 60%; text-align: right; }
.card .ram { position: absolute; top: 1.2em; right: 4px; font-size: .62em; color: var(--muted); }
.card .body { position: absolute; left: 4px; right: 4px; top: 2.3em; bottom: 2.2em; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
.card .name { font-weight: 600; font-size: .92em; line-height: 1.1; }
.card .name small { display: block; font-weight: 400; font-size: .85em; color: var(--muted); }
.card .tags { position: absolute; left: 4px; right: 40%; bottom: 3px; font-size: .6em; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.card .txt { font-size: .72em; line-height: 1.15; color: #c8cfdb; overflow: hidden; }
.card .pw { position: absolute; right: 3px; bottom: 3px; min-width: 1.8em; height: 1.8em; padding: 0 .25em; border-radius: 5px; border: 2px solid var(--cc); background: #0d0f13; display: grid; place-items: center; font-weight: 700; font-size: 1.1em; }
.card .pw.buff { color: var(--ok); } .card .pw.nerf { color: var(--bad); }
.card .gear { position: absolute; left: 3px; bottom: 1.4em; display: flex; gap: 2px; max-width: 60%; flex-wrap: wrap; }
.card .gear i { font-style: normal; font-size: .6em; background: var(--surface2); border: 1px solid var(--cc); border-radius: 3px; padding: 0 3px; }
.card.mini .txt, .card.mini .tags { display: none; }
.card.back { background: repeating-linear-gradient(45deg, #1a1f2a, #1a1f2a 6px, #202736 6px, #202736 12px); border-color: #4a5468; display: grid; place-items: center; }
.card.back .bl { font-size: .8em; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; text-align: center; }
.card.spent { transform: rotate(90deg); margin: calc(var(--cw) * .2) calc(var(--cw) * .2); }
.card.lag::before { content: 'LAG'; position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: .6em; letter-spacing: .2em; background: rgba(0,0,0,.55); color: var(--muted); z-index: 2; }
.card.faceup-leg { box-shadow: 0 0 0 1px var(--accent); }
.card.sel { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--accent), 0 8px 18px rgba(0,0,0,.5); }
.card.spent.sel { transform: rotate(90deg) translateX(-8px); }
.card.can { box-shadow: 0 0 0 2px rgba(58,208,138,.9); }
.card.cant { filter: saturate(.55) brightness(.8); }
.card.drop-ok { box-shadow: 0 0 0 3px var(--ok), 0 0 18px rgba(58,208,138,.6); animation: pulse 1s infinite; }
.card.threat { box-shadow: 0 0 0 3px var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--ok), 0 0 4px rgba(58,208,138,.2); } }
.zone-field.drop-ok, .eddies.drop-ok, .zone-gigs.drop-ok { outline: 2px solid var(--ok); background: rgba(58,208,138,.08); }
.dragghost { position: fixed; pointer-events: none; z-index: 100; opacity: .92; transform: translate(-50%, -60%) rotate(-3deg) scale(1.1); filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }

/* ------------------------------------------------------------------ middle tray + hand */
.tray { display: flex; gap: 10px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; height: 116px; min-height: 116px; max-height: 116px; overflow-y: auto; flex: none; }
.tray .info { flex: 1; min-width: 0; font-size: 13px; overflow-y: auto; }
.tray .info .h { font-weight: 600; }
.tray .info .t { color: #c8cfdb; font-size: 12px; margin-top: 2px; overflow: visible; }
.tray .acts { display: flex; flex-direction: column; gap: 5px; justify-content: center; align-items: stretch; min-width: 150px; }
.tray .acts button { font-size: 13px; padding: 6px 10px; }
.banner { color: var(--bad); font-weight: 600; }
.hand { padding: 6px 8px max(8px, env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; align-items: flex-end; min-height: calc(var(--hw) * 1.4 + 22px); }
.hand .card { --cw: var(--hw); }
.hand .card:hover { transform: translateY(-6px); }
.hand .empty { color: var(--muted); font-size: 12px; align-self: center; }
.rhand { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.rhand .backs { display: flex; }
.rhand .backs i { width: 14px; height: 20px; margin-left: -8px; border-radius: 3px; border: 1px solid #4a5468; background: #202736; }
.rhand .backs i:first-child { margin-left: 0; }

/* ------------------------------------------------------------------ log, modal, toast */
.logpanel { display: none; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); min-height: 0; }
.logpanel.open { display: flex; position: absolute; right: 0; top: 44px; bottom: 0; width: min(320px, 88vw); z-index: 20; box-shadow: -10px 0 30px rgba(0,0,0,.5); }
.logpanel h3 { padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--line); }
.loglines { overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.45; flex: 1; }
.loglines div { padding: 1px 0; color: #c0c8d6; } .loglines .turn { color: var(--accent); margin-top: 6px; font-weight: 600; }
.modal { position: fixed; inset: 0; background: rgba(5,6,9,.72); display: grid; place-items: center; z-index: 50; padding: 12px; }
.modal .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.modal h2 { font-size: 17px; margin-bottom: 6px; } .modal p { color: #c8cfdb; font-size: 14px; margin: 6px 0 12px; }
.opts { display: flex; flex-direction: column; gap: 6px; } .opts button { text-align: left; }
.mullhand { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; justify-content: center; }
.mullhand .card { --cw: 86px; }
.toast { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); background: #2b1a1c; border: 1px solid var(--bad); color: #ffd7d8; padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.toast.info { background: #1b2430; border-color: var(--blue); color: #d6e6ff; }
.zoom { position: fixed; z-index: 70; pointer-events: none; }
.zoom .card { --cw: 230px; cursor: default; }

/* ------------------------------------------------------------------ browser */
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cardgrid .card { --cw: 150px; width: 100%; max-width: 190px; }
input[type=search], select { background: var(--surface2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; }
kbd { background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
.top .status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 700px) { .top .title, .rhand span.backs { display: none; } .top { gap: 6px; } .rhand { font-size: 10px; } }

/* official art (when art/<id>.webp exists next to the app) */
.card img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; z-index: 0; pointer-events: none; }
.card:not(.art-on) img.art { opacity: 0; }
.card.art-on { background: #000; border-width: 1px; }
.card.art-on > *:not(img.art):not(.gear):not(.pw.buff):not(.pw.nerf):not(.foil) { display: none; }
.card.art-on .gear, .card.art-on .pw { z-index: 2; }
.card.art-on.lag::before { z-index: 3; }
/* tutorial coach */
.coach { display: flex; flex-direction: column; gap: 6px; }
.coach .step { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.coach .say { font-size: 18px; font-weight: 600; line-height: 1.25; }
.coach .row { margin-top: 2px; }
.coach-focus { outline: 3px solid var(--accent) !important; outline-offset: 2px; animation: pulse 1s infinite; border-radius: 8px; }

/* ================================================================== Night City HUD theme (overrides) */
:root {
  --bg: #07070a; --surface: #0e0e12; --surface2: #17170f; --line: #3b3a14; --text: #f1efe0; --muted: #9a9778;
  --accent: #fcee09; --accent-dim: #8a8206; --r: 4px;
  --hud: 'Rajdhani', 'Bahnschrift', 'Oswald', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --cut: 12px;
}
html, body {
  background-color: var(--bg);
  background-image: linear-gradient(rgba(252,238,9,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(252,238,9,.035) 1px, transparent 1px);
  background-size: 28px 28px;
}
h1, h2, h3, button, .zlabel, .top .title, .top .status, .coach .step, .brand .tag, .tray .info .h { font-family: var(--hud); text-transform: uppercase; letter-spacing: .06em; }
button { border-radius: 0; border: 1px solid var(--accent-dim); background: rgba(252,238,9,.04); font-weight: 600; font-size: 14px;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
button:hover:not(:disabled) { border-color: var(--accent); background: rgba(252,238,9,.12); }
button.primary, .seg button.on { background: var(--accent); color: #0b0a00; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: #fff44f; }
button.ghost { background: transparent; border-color: transparent; }

/* chamfered HUD panels with yellow corner brackets */
.panel, .half, .tray, .modal .box, .deckpick, .logpanel {
  position: relative; border-radius: 0; border: 1px solid var(--line);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.panel::before, .half::before, .tray::before, .modal .box::before { content: ''; position: absolute; top: 0; left: 0; width: 18px; height: 18px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); pointer-events: none; }
.panel::after, .half::after, .tray::after, .modal .box::after { content: ''; position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); pointer-events: none; }
.half.rival::before, .half.rival::after { border-color: #ff4d5a; }
.half.rival { border-color: #3d1a1e; }
.panel h3 { color: var(--accent); }
.panel h3::before { content: '// '; color: var(--accent-dim); }
.deckpick { border: 1px solid var(--line); background: rgba(252,238,9,.03); }
.deckpick.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 14px rgba(252,238,9,.18); background: rgba(252,238,9,.08); }
.deckpick b { font-family: var(--hud); font-size: 18px; text-transform: uppercase; letter-spacing: .05em; }
.zone-field, .zone-gigs, .eddies { border-radius: 0; border-color: #4a4818; }
.zlabel { color: var(--accent-dim); font-size: 11px; }
.zlabel b { color: var(--accent); }

/* top bar with hazard stripe underline */
.top { position: relative; background: #0a0a06; border-bottom: none; }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, #0a0a06 8px 16px); opacity: .85; }
.top .title { color: var(--accent); font-size: 16px; font-weight: 700; letter-spacing: .12em; }
.top .status { color: var(--text); font-size: 14px; }
.brand h1 { font-size: 34px; color: var(--accent); letter-spacing: .1em; text-shadow: 0 0 18px rgba(252,238,9,.35); }
.brand .tag { background: var(--accent); color: #0b0a00; padding: 2px 8px; font-weight: 700; clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }

/* tray + coach */
.tray { background: #0b0b07; border-color: #5a571a; }
.tray .info .h { color: var(--accent); font-size: 16px; }
.banner { color: #ff4d5a !important; }
.coach .say { font-family: var(--hud); text-transform: none; font-size: 22px; letter-spacing: .01em; }
.coach .step { display: inline-block; align-self: flex-start; background: var(--accent); color: #0b0a00; padding: 1px 8px; font-weight: 700; }
.coach-focus { outline-color: var(--accent) !important; box-shadow: 0 0 16px rgba(252,238,9,.5); border-radius: 0; }

/* hand, log, modal */
.hand { background: #0a0a06; border-top: 2px solid var(--accent-dim); }
.logpanel { background: #0a0a06; border-left: 1px solid var(--line); }
.logpanel h3 { color: var(--accent); border-bottom: 1px dashed var(--accent-dim); }
.loglines .turn { color: var(--accent); font-family: var(--hud); letter-spacing: .06em; }
.modal { background: rgba(3,3,0,.82); }
.modal .box { background: #0b0b07; border-color: var(--accent-dim); }
.modal .box h2 { color: var(--accent); font-size: 22px; letter-spacing: .08em; }
.toast { border-radius: 0; background: #1a0b0d; border-color: #ff4d5a; }
.toast.info { background: #14140a; border-color: var(--accent); color: var(--text); }

/* dice and Eddies in HUD yellow */
.eddy { background: var(--accent); border-color: #fff8a0; box-shadow: 0 0 8px rgba(252,238,9,.45); }
